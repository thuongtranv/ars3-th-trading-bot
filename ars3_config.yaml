# ARS-3 Trading Bot Configuration (Enhanced Version)
# Main bot settings
coins: ["BTC/USDT", "ETH/USDT", "BNB/USDT", "SOL/USDT", "ADA/USDT"]
timeframe: "1h"
htf_timeframe: "4h"  # Higher timeframe for trend filtering
initial_capital: 10000.0
risk_per_trade: 0.01  # Risk 1% of capital per trade
max_dd_percent: 15    # Maximum allowed drawdown before emergency stop
max_daily_loss: 500   # Maximum daily loss before trading halt
simulation_mode: true # true = paper trading, false = live trading
commission_rate: 0.0004  # Exchange commission (0.04% for Binance)

# Exchange settings
exchange: "binance"
futures: false  # Set to true for futures trading
testnet: true   # Use testnet for safety

# Risk Management Settings
risk_management:
  max_position_size_pct: 0.1      # Max 10% of capital per position
  max_positions: 3                # Maximum concurrent positions
  emergency_stop_loss_pct: 0.05   # Emergency stop at 5% account loss
  position_timeout_hours: 72      # Force close positions after 72 hours
  max_slippage_pct: 0.02         # Cancel orders if slippage > 2%

# Strategy settings for RS-75 (Range Scalper)
rs75_strategy:
  # Technical indicators
  bb_period: 20
  bb_std: 2.5
  rsi_period: 7
  adx_period: 14
  atr_period: 14
  
  # Signal thresholds
  rsi_oversold: 30
  rsi_overbought: 70
  adx_max: 22               # ADX max for ranging market detection
  natr_max: 0.0045         # Normalized ATR max (volatility filter)
  min_bb_width_pct: 0.02   # Minimum BB width as % of price
  
  # Entry confirmation
  use_confirmation_entry: true    # Wait for candle close inside BB
  use_smart_sl: true             # SL based on swing highs/lows
  swing_period: 12               # Bars to look back for swing levels
  use_smart_tp: true             # TP1 at BB midline
  use_volume_filter: true        # Require above-average volume
  volume_ma_period: 20
  use_htf_filter: true           # Filter by higher timeframe trend
  htf_ma_period: 50
  
  # Position sizing and risk
  risk_pct: 0.01                 # Risk per trade as % of capital
  max_risk_per_signal: 0.02      # Never risk more than 2% per signal
  min_reward_risk_ratio: 1.5     # Minimum R:R ratio
  
  # Exit rules
  tp1_risk_multiple: 1.5         # TP1 at 1.5x risk distance
  tp2_risk_multiple: 3.0         # TP2 at 3x risk distance
  trailing_stop: false           # Enable trailing stop after TP1
  break_even_after_tp1: true     # Move SL to break-even after TP1

# Strategy settings for Trend Follower
trend_strategy:
  # Technical indicators
  fast_ema_period: 12
  slow_ema_period: 26
  adx_period: 14
  adx_threshold: 25          # Minimum ADX for trend confirmation
  atr_period: 14
  
  # Signal validation
  min_trend_strength: 0.02   # Minimum price move to confirm trend
  pullback_tolerance: 0.3    # Allow 30% pullback from trend direction
  
  # Risk management
  atr_sl_multiplier: 2.5     # Stop loss at 2.5x ATR
  risk_pct: 0.01            # Risk per trade
  max_position_hold_days: 10 # Max days to hold trend position
  
  # Exit rules
  tp1_atr_multiple: 3.0      # First target at 3x ATR
  tp2_atr_multiple: 6.0      # Second target at 6x ATR
  use_trailing_stop: true    # Enable trailing stop
  trail_distance_atr: 2.0    # Trail at 2x ATR distance

# Market regime detection
regime_detection:
  volatility_window: 20      # Bars to calculate volatility
  trend_strength_window: 50  # Bars to measure trend strength
  regime_switch_threshold: 0.3 # Threshold for regime change
  min_bars_same_regime: 5    # Min bars before switching strategies

# Notification settings
notifications:
  telegram:
    enabled: true
    send_entries: true
    send_exits: true
    send_daily_summary: true
    send_errors: true
  
  email:
    enabled: false
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    daily_report_time: "18:00"  # UTC time

# Logging and monitoring
logging:
  level: "INFO"              # DEBUG, INFO, WARNING, ERROR
  max_log_file_size_mb: 50   # Rotate logs at 50MB
  keep_log_files: 10         # Keep last 10 log files
  log_trades: true
  log_signals: true
  log_errors: true

# Data management
data_management:
  max_equity_records: 10000   # Keep last 10k equity records
  max_trade_records: 5000     # Keep last 5k trade records
  backup_frequency_hours: 24   # Backup data every 24 hours
  data_retention_days: 30      # Keep data for 30 days

# Performance monitoring
performance:
  calculate_metrics_interval: 300  # Calculate metrics every 5 minutes
  equity_snapshot_interval: 60     # Save equity every minute
  health_check_interval: 30        # System health check every 30 seconds
  
  # Alert thresholds
  max_drawdown_alert: 10          # Alert if drawdown > 10%
  consecutive_losses_alert: 5      # Alert after 5 consecutive losses
  low_balance_alert_pct: 20       # Alert if balance drops 20% from peak

# Connection and reliability
connection:
  heartbeat_interval: 60          # Ping exchange every 60 seconds
  connection_timeout: 30          # Connection timeout in seconds
  max_reconnect_attempts: 5       # Max reconnection attempts
  reconnect_delay: 10            # Delay between reconnect attempts
  rate_limit_buffer: 0.1         # Stay 10% below rate limits

# Backtesting settings
backtest:
  commission_rate: 0.0004        # Same as live trading
  slippage_pct: 0.01            # 1% average slippage
  realistic_execution: true      # Use realistic fill prices
  position_timeout_bars: 200     # Force close after 200 bars
  
  # Monte Carlo settings
  monte_carlo_runs: 1000         # Number of MC simulations
  bootstrap_trades: true         # Bootstrap historical trades
  confidence_levels: [95, 99]   # Confidence intervals to calculate

# Emergency controls
emergency:
  kill_switch_file: "EMERGENCY_STOP"     # File to trigger emergency stop
  max_daily_trades: 20                    # Maximum trades per day
  circuit_breaker_loss_pct: 0.1          # Stop trading at 10% loss
  force_flatten_on_shutdown: true        # Close all positions on shutdown
  emergency_contact_telegram: true       # Send emergency notifications

# Advanced features
advanced:
  multi_timeframe_analysis: true         # Use multiple timeframes
  correlation_filter: true               # Avoid correlated positions
  market_session_filter: false           # Trade only during market hours
  news_sentiment_filter: false           # Filter trades based on news (requires API)
  
  # Machine learning (future expansion)
  ml_enhanced_signals: false             # Use ML for signal enhancement
  adaptive_parameters: false             # Dynamically adjust parameters
  
  # Portfolio management
  portfolio_rebalancing: false           # Rebalance portfolio periodically
  dynamic_position_sizing: false         # Adjust sizing based on performance