# ARS-3 Trading Bot Configuration (Expert-Tuned for Maximum Expectancy)
# Thiết kế dựa trên nguyên tắc: "Frequency over Perfection, Adaptive over Rigid"

coins: ["BTC/USDT", "ETH/USDT", "SOL/USDT", "ADA/USDT"]
timeframe: "1h"
htf_timeframe: "4h"
initial_capital: 10000.0
risk_per_trade: 0.01
max_dd_percent: 15
max_daily_loss: 250
simulation_mode: false
commission_rate: 0.0004

exchange: "bybit"
futures: false
testnet: true

risk_management:
  max_position_size_pct: 0.15  # Tăng từ 0.1 - cần tận dụng cơ hội tốt
  max_positions: 4             # Tăng từ 3 - đa dạng hóa
  emergency_stop_loss_pct: 0.05
  position_timeout_hours: 48   # Giảm từ 72 - tránh hold quá lâu
  max_slippage_pct: 0.025      # Tăng từ 0.02 - chấp nhận slippage cao hơn

# RANGE STRATEGY - Tối ưu cho crypto volatility
rs75_strategy:
  bb_period: 20
  bb_std: 2.0          # Giảm từ 2.5 - BB nhạy hơn
  rsi_period: 14       # Tăng từ 7 - ổn định hơn
  adx_period: 14
  atr_period: 14
  
  # THRESHOLDS - Dựa trên crypto market behavior
  rsi_oversold: 40     # 30->40: Crypto ít khi xuống quá 30
  rsi_overbought: 60   # 70->60: Exit sớm hơn trong crypto
  adx_max: 35          # 20->35: Crypto có thể range với ADX cao
  natr_max: 0.035      # 0.018->0.035: Crypto volatility cao
  min_bb_width_pct: 0.008  # 0.015->0.008: Chấp nhận range hẹp hơn
  
  # ENTRY/EXIT - Aggressive but controlled
  use_confirmation_entry: false  # Entry ngay khi có signal
  use_smart_sl: true
  swing_period: 8               # 12->8: Phản ứng nhanh hơn
  use_smart_tp: true
  use_volume_filter: false      # Không dùng volume filter
  use_htf_filter: false         # Không dùng HTF filter
  
  # RISK/REWARD - Realistic for crypto
  risk_pct: 0.025              # 0.02->0.025: Risk cao hơn cho reward cao hơn
  max_risk_per_signal: 0.03    # 0.02->0.03: Tăng risk cho range trades
  min_reward_risk_ratio: 1.0   # 1.5->1.0: Thực tế hơn
  
  # EXIT STRATEGY
  tp1_risk_multiple: 1.2       # 1.5->1.2: Target gần để tăng win rate
  tp2_risk_multiple: 2.5       # 3.0->2.5: Target thứ 2 thực tế hơn
  trailing_stop: true          # false->true: Bảo vệ profit
  break_even_after_tp1: true

# TREND STRATEGY - Core của profit generation
trend_strategy:
  # BASIC INDICATORS
  fast_ema_period: 12
  slow_ema_period: 26
  macro_ema_period: 200
  adx_period: 14
  adx_threshold: 22        # 22->15: CRITICAL - Thấp nhất có thể
  strong_adx_threshold: 25 # 35->25: Định nghĩa lại "strong trend"
  atr_period: 14

  # MOMENTUM
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  momentum_period: 10

  # VOLATILITY - Adapted for crypto
  bb_period: 20
  bb_std: 2.0
  min_bb_width: 0.003      # 0.03->0.003: Chấp nhận volatility thấp
  max_bb_width: 0.20       # 0.12->0.20: Chấp nhận volatility cao
  high_volatility_threshold: 0.10  # 0.06->0.10
  low_volatility_threshold: 0.01   # 0.02->0.01

  # VOLUME - Minimal filtering
  volume_lookback: 20
  volume_sma_period: 20
  min_volume_ratio: 0.8    # 1.2->0.8: Không bỏ lỡ cơ hội

  # HTF ANALYSIS - Disabled for more signals
  # Multi-timeframe analysis
  use_htf_filter: false
  htf_ema_fast_period: 48  # 4x faster EMA for HTF
  htf_ema_slow_period: 104 # 4x slower EMA for HTF

  # RISK MANAGEMENT - Balanced
  base_risk_pct: 0.02      # 0.015->0.02
  max_risk_pct: 0.035      # 0.025->0.035
  min_position_size: 0.001
  max_position_notional_pct: 0.12  # 0.08->0.12

  # STOP LOSS - Adaptive
  base_sl_atr_multiplier: 1.0      # 1.5->1.0: Tighter SL
  high_vol_sl_multiplier: 1.3      # 1.8->1.3: Reasonable cho high vol
  low_vol_sl_multiplier: 0.8       # 1.2->0.8: Very tight cho low vol
  strong_trend_threshold: 0.025    # 0.015->0.025
  strong_trend_sl_multiplier: 0.9  # 1.3->0.9: Tighter cho strong trend
  sl_swing_lookback: 10            # 20->10: Faster adaptation

  # TAKE PROFIT - Realistic
  base_tp1_risk_multiple: 1.3      # 2.0->1.3: Closer target
  base_tp2_risk_multiple: 2.5      # 4.0->2.5: Realistic second target
  strong_adx_tp_multiplier: 1.1    # 1.2->1.1: Modest extension
  high_vol_tp_multiplier: 1.05     # 1.1->1.05: Small extension

  # SIGNAL QUALITY - KEY CHANGE
  min_signal_quality: 0.15   # 0.60->0.15: DRAMATIC reduction

  # ENTRY TIMING
  pullback_max_bars_since_cross: 20  # 12->20: More flexible timing
  
  # TRAILING
  dynamic_trail_rr_threshold: 1.5   # 2.5->1.5: Earlier trailing
  dynamic_trail_multiplier_tight: 1.0  # 1.2->1.0: Tighter trailing
  dynamic_trail_multiplier_wide: 1.5   # 2.5->1.5: Reasonable wide trail

  # Oscillator indicators
  stoch_k_period: 14
  stoch_d_period: 3
  williams_r_period: 14

  # OPERATIONAL
  cooldown_bars: 1         # 4->1: Minimum cooldown
  max_daily_loss_pct: 0.05 # 0.04->0.05: Slightly higher tolerance
  extreme_volatility_pct: 0.25  # 0.12->0.25: Don't stop in crypto volatility

# REGIME DETECTION - Completely redesigned
regime_detection:
  min_data_points: 100     # 200->100: Less data needed

  # PERIODS
  adx_period: 14
  atr_period: 14
  slope_ema_period: 100    # 200->100: Faster adaptation
  slope_period: 30         # 50->30: Shorter lookback
  bb_period: 20
  vol_period: 30           # 50->30: Shorter volume period
  
  # CORE THRESHOLDS - Realistic for crypto
  adx_low: 8               # 15->8: Very low threshold
  adx_high: 20             # 30->20: Lower high threshold
  natr_low: 0.001          # 0.002->0.001: Accept very low volatility
  natr_high: 0.020         # 0.008->0.020: Accept high volatility
  slope_abs_low: 0.00001   # 0.00005->0.00001: Very sensitive
  slope_abs_high: 0.00020  # 0.00015->0.00020: Higher threshold
  
  # REGIME SWITCHING - Very permissive
  trend_on: 0.35           # 0.55->0.35: Easy to enter trend
  trend_off: 0.25          # 0.45->0.25: Hard to exit trend
  range_on: 0.35           # 0.4->0.35: Easy to enter range
  range_off: 0.25          # 0.3->0.25: Hard to exit range
  
  # COMPRESSION
  bb_width_low: 0.002      # 0.01->0.002: Very sensitive
  
  # STABILITY - Minimal
  cooldown_bars: 0         # 3->0: No cooldown for regime changes
  
  # WEIGHTS - Balanced
  trend_weights:
    adx: 0.3               # 0.5->0.3: Less weight on ADX
    natr: 0.25             # 0.2->0.25: More weight on volatility
    slope: 0.3             # 0.2->0.3: More weight on direction
    volume: 0.15           # 0.1->0.15: Slightly more volume weight
    
  range_weights:
    adx: 0.3               # 0.5->0.3: Less ADX dependency
    natr: 0.25             # 0.3->0.25: Reasonable volatility weight
    slope: 0.45            # 0.2->0.45: Strong emphasis on flat slope

# NOTIFICATIONS
notifications:
  telegram:
    enabled: true
    send_entries: true
    send_exits: true
    send_regime_changes: false  # true->false: Reduce noise
    send_daily_summary: true
    send_errors: true
  
  email:
    enabled: false

# LOGGING
logging:
  level: "INFO"
  max_log_file_size_mb: 100  # 50->100: More detailed logs
  keep_log_files: 20         # 10->20: Keep more history
  log_trades: true
  log_signals: true
  log_regime_changes: false  # true->false: Less noise
  log_errors: true

# PERFORMANCE MONITORING
performance:
  calculate_metrics_interval: 180  # 300->180: More frequent updates
  equity_snapshot_interval: 30     # 60->30: More frequent snapshots
  health_check_interval: 15        # 30->15: More frequent health checks
  
  max_drawdown_alert: 8            # 10->8: Earlier warning
  consecutive_losses_alert: 4      # 5->4: Earlier warning
  low_balance_alert_pct: 15        # 20->15: Earlier warning
  regime_instability_alert: 25     # 10->25: Less sensitive

# CONNECTION
connection:
  heartbeat_interval: 30     # 60->30: More frequent heartbeat
  connection_timeout: 20     # 30->20: Shorter timeout
  max_reconnect_attempts: 8  # 5->8: More persistent
  reconnect_delay: 5         # 10->5: Faster reconnection
  rate_limit_buffer: 0.2     # 0.1->0.2: More conservative

# BACKTEST
backtest:
  commission_rate: 0.0006    # 0.0004->0.0006: More realistic
  slippage_pct: 0.015        # 0.01->0.015: More realistic
  realistic_execution: true
  position_timeout_bars: 100 # 200->100: Shorter timeout
  include_regime_analysis: true
  
  monte_carlo_runs: 2000     # 1000->2000: More comprehensive
  bootstrap_trades: true
  confidence_levels: [90, 95, 99]  # Add 90% level

# EMERGENCY CONTROLS
emergency:
  kill_switch_file: "EMERGENCY_STOP"
  max_daily_trades: 50       # 20->50: Allow more trading
  circuit_breaker_loss_pct: 0.12  # 0.1->0.12: Higher tolerance
  force_flatten_on_shutdown: true
  emergency_contact_telegram: true
  max_regime_changes_per_day: 100  # 15->100: No artificial limits

# ADVANCED FEATURES
advanced:
  multi_timeframe_analysis: false  # true->false: Simplify
  correlation_filter: false        # Disable correlation filtering
  market_session_filter: false
  news_sentiment_filter: false
  regime_based_position_sizing: true
  
  ml_enhanced_signals: false
  adaptive_parameters: false
  
  portfolio_rebalancing: false
  dynamic_position_sizing: true    # false->true: Enable dynamic sizing

# DATA MANAGEMENT - Optimized
data_management:
  max_equity_records: 20000   # 10000->20000: More history
  max_trade_records: 10000    # 5000->10000: More trade history
  backup_frequency_hours: 12  # 24->12: More frequent backups
  data_retention_days: 60     # 30->60: Longer retention